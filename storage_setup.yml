---
# Storage server setup playbook (Storage01)
# Configures NFS server
# Execute: ansible-playbook storage_setup.yml

- name: Setup Storage Server
  hosts: storage
  become: yes
  
  pre_tasks:
    - name: Update system packages
      yum:
        name: '*'
        state: latest
        update_cache: yes
  
  roles:
    - nfs_server
  
  post_tasks:
    - name: Display NFS export information
      debug:
        msg:
          - "NFS Server: {{ ansible_host }}"
          - "Export Path: {{ nfs_export_path }}"
          - "Allowed Network: {{ network_subnet }}"
    
    - name: Verify NFS is accessible
      shell: showmount -e {{ ansible_host }}
      register: nfs_showmount
      changed_when: false
      ignore_errors: yes
    
    - name: Display showmount output
      debug:
        var: nfs_showmount.stdout_lines
      when: nfs_showmount is succeeded
