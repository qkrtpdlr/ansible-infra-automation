---
# WEB02 서버 설정 (Apache + Static Web + NFS)
# 실행: ansible-playbook web2_setup.yml

- name: Setup WEB02 Web Server
  hosts: webservers
  become: yes
  
  tasks:
    - name: Install Apache and NFS packages
      yum:
        name:
          - httpd
          - mod_ssl
          - nfs-utils
        state: present

    - name: Create web directories
      file:
        path: "{{ item }}"
        state: directory
        owner: apache
        group: apache
        mode: '0755'
      loop:
        - /srv/web
        - /srv/web/web02
        - /srv/web/shared

    - name: Configure Apache to listen on port 8080
      lineinfile:
        path: /etc/httpd/conf/httpd.conf
        line: 'Listen 8080'
        insertafter: '^Listen 80'
      notify: restart apache

    - name: Create VirtualHost for web02 (port 80)
      template:
        src: ../template/web02_site1.conf.j2
        dest: /etc/httpd/conf.d/web02-80.conf
        owner: root
        group: root
        mode: '0644'
      notify: restart apache

    - name: Create VirtualHost for web02 (port 8080)
      template:
        src: ../template/web02_site2.conf.j2
        dest: /etc/httpd/conf.d/web02-8080.conf
        owner: root
        group: root
        mode: '0644'
      notify: restart apache

    - name: Create index.html for web02
      template:
        src: ../template/web02_index.j2
        dest: /srv/web/web02/index.html
        owner: apache
        group: apache
        mode: '0644'

    - name: Mount NFS share
      mount:
        path: /srv/web/shared
        src: "{{ nfs_server }}:/srv/nfs/shared"
        fstype: nfs
        opts: defaults,_netdev
        state: mounted

    - name: Configure SELinux for Apache NFS
      seboolean:
        name: httpd_use_nfs
        state: yes
        persistent: yes

    - name: Open HTTP ports in firewall
      firewalld:
        port: "{{ item }}"
        permanent: yes
        state: enabled
        immediate: yes
      loop:
        - 80/tcp
        - 8080/tcp

    - name: Enable and start Apache
      systemd:
        name: httpd
        state: started
        enabled: yes

    - name: Display URLs
      debug:
        msg:
          - "Web02 (80): http://{{ ansible_host }}"
          - "Web02 (8080): http://{{ ansible_host }}:8080"

  handlers:
    - name: restart apache
      systemd:
        name: httpd
        state: restarted
