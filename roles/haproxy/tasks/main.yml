---
# HAProxy installation and configuration tasks

- name: Install HAProxy
  yum:
    name: haproxy
    state: present

- name: Create HAProxy configuration from template
  template:
    src: haproxy.cfg.j2
    dest: /etc/haproxy/haproxy.cfg
    owner: root
    group: root
    mode: '0644'
    validate: 'haproxy -c -f %s'
  notify: restart haproxy

- name: Configure SELinux for HAProxy
  seboolean:
    name: haproxy_connect_any
    state: yes
    persistent: yes

- name: Open HAProxy ports in firewall
  firewalld:
    port: "{{ item }}"
    permanent: yes
    state: enabled
    immediate: yes
  loop:
    - 80/tcp
    - 8404/tcp

- name: Enable and start HAProxy service
  systemd:
    name: haproxy
    state: started
    enabled: yes

- name: Wait for HAProxy to be ready
  wait_for:
    port: 80
    delay: 2
    timeout: 30
