---
# Apache web server installation and configuration tasks

- name: Install Apache and PHP packages
  yum:
    name:
      - httpd
      - mod_ssl
      - "{{ php_packages }}"
    state: present

- name: Create web directories
  file:
    path: "{{ item }}"
    state: directory
    owner: apache
    group: apache
    mode: '0755'
  loop:
    - /srv/web
    - /srv/web/web01
    - /srv/web/web02
    - /srv/web/wordpress
    - /srv/web/shared

- name: Configure Apache to listen on multiple ports
  lineinfile:
    path: /etc/httpd/conf/httpd.conf
    line: "Listen {{ item }}"
    insertafter: '^Listen 80'
  loop: "{{ apache_listen_ports | difference([80]) }}"
  notify: restart apache

- name: Create VirtualHost configuration files
  template:
    src: vhost.conf.j2
    dest: "/etc/httpd/conf.d/{{ item.name }}.conf"
    owner: root
    group: root
    mode: '0644'
  loop: "{{ vhosts }}"
  notify: restart apache

- name: Create sample index.html for each site
  template:
    src: "index.html.j2"
    dest: "{{ item.document_root }}/index.html"
    owner: apache
    group: apache
    mode: '0644'
  loop: "{{ vhosts }}"

- name: Configure SELinux for Apache
  seboolean:
    name: "{{ item }}"
    state: yes
    persistent: yes
  loop:
    - httpd_can_network_connect
    - httpd_can_network_connect_db
    - httpd_use_nfs

- name: Open HTTP ports in firewall
  firewalld:
    port: "{{ item }}/tcp"
    permanent: yes
    state: enabled
    immediate: yes
  loop: "{{ apache_listen_ports }}"

- name: Enable and start Apache service
  systemd:
    name: httpd
    state: started
    enabled: yes

- name: Wait for Apache to be ready
  wait_for:
    port: 80
    delay: 2
    timeout: 30
