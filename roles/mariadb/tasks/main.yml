---
# MariaDB database server installation and configuration tasks

- name: Install MariaDB server packages
  yum:
    name:
      - mariadb-server
      - python3-PyMySQL
    state: present

- name: Create MariaDB configuration directory
  file:
    path: /etc/my.cnf.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Configure MariaDB for remote access
  template:
    src: server.cnf.j2
    dest: /etc/my.cnf.d/server.cnf
    owner: root
    group: root
    mode: '0644'
  notify: restart mariadb

- name: Enable and start MariaDB service
  systemd:
    name: mariadb
    state: started
    enabled: yes

- name: Set MariaDB root password
  mysql_user:
    name: root
    password: "{{ db_password }}"
    host: localhost
    login_unix_socket: /var/lib/mysql/mysql.sock
  no_log: true

- name: Create .my.cnf file with root credentials
  template:
    src: root-my.cnf.j2
    dest: /root/.my.cnf
    owner: root
    group: root
    mode: '0600'
  no_log: true

- name: Remove anonymous users
  mysql_user:
    name: ''
    host_all: yes
    state: absent

- name: Remove test database
  mysql_db:
    name: test
    state: absent

- name: Create WordPress database
  mysql_db:
    name: "{{ db_name }}"
    state: present
    encoding: utf8mb4
    collation: utf8mb4_unicode_ci

- name: Create WordPress database user
  mysql_user:
    name: "{{ db_user }}"
    password: "{{ db_password }}"
    priv: "{{ db_name }}.*:ALL"
    host: "{{ network_subnet | regex_replace('/.*', '') }}%"
    state: present
  no_log: true

- name: Open MariaDB port in firewall
  firewalld:
    port: "{{ db_port }}/tcp"
    permanent: yes
    state: enabled
    immediate: yes

- name: Verify database creation
  mysql_db:
    name: "{{ db_name }}"
    state: present
  register: db_verify

- name: Display database status
  debug:
    msg: "Database {{ db_name }} is ready"
  when: db_verify is succeeded
