---
# Database 서버 설정 (MariaDB)
# 실행: ansible-playbook db-central01_setup.yml

- name: Setup MariaDB Database Server
  hosts: database
  become: yes
  
  tasks:
    - name: Install MariaDB server packages
      yum:
        name:
          - mariadb-server
          - python3-PyMySQL
        state: present

    - name: Create MariaDB configuration directory
      file:
        path: /etc/my.cnf.d
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Configure MariaDB for remote access
      template:
        src: ../template/mariadb-server.cnf.j2
        dest: /etc/my.cnf.d/server.cnf
        owner: root
        group: root
        mode: '0644'
      notify: restart mariadb

    - name: Enable and start MariaDB service
      systemd:
        name: mariadb
        state: started
        enabled: yes

    - name: Set MariaDB root password
      mysql_user:
        name: root
        password: "{{ db_password }}"
        host: localhost
        login_unix_socket: /var/lib/mysql/mysql.sock
      no_log: true
      ignore_errors: yes

    - name: Create .my.cnf file with root credentials
      template:
        src: ../template/root-my.cnf.j2
        dest: /root/.my.cnf
        owner: root
        group: root
        mode: '0600'
      no_log: true

    - name: Remove anonymous users
      mysql_user:
        name: ''
        host_all: yes
        state: absent
      ignore_errors: yes

    - name: Remove test database
      mysql_db:
        name: test
        state: absent
      ignore_errors: yes

    - name: Create WordPress database
      mysql_db:
        name: wordpress
        state: present
        encoding: utf8mb4
        collation: utf8mb4_unicode_ci

    - name: Create WordPress database user
      mysql_user:
        name: wpuser
        password: "{{ db_password }}"
        priv: "wordpress.*:ALL"
        host: "192.168.56.%"
        state: present
      no_log: true

    - name: Open MariaDB port in firewall
      firewalld:
        port: 3306/tcp
        permanent: yes
        state: enabled
        immediate: yes

    - name: Display database information
      debug:
        msg:
          - "Database Server: {{ ansible_host }}:3306"
          - "Database Name: wordpress"
          - "Database User: wpuser"
          - "Allowed Network: 192.168.56.%"

  handlers:
    - name: restart mariadb
      systemd:
        name: mariadb
        state: restarted
