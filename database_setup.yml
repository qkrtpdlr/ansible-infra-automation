---
# Database server setup playbook (DB-central01)
# Configures MariaDB
# Execute: ansible-playbook database_setup.yml

- name: Setup Database Server
  hosts: database
  become: yes
  
  pre_tasks:
    - name: Update system packages
      yum:
        name: '*'
        state: latest
        update_cache: yes
  
  roles:
    - mariadb
  
  post_tasks:
    - name: Display database information
      debug:
        msg:
          - "Database Server: {{ ansible_host }}:{{ db_port }}"
          - "Database Name: {{ db_name }}"
          - "Database User: {{ db_user }}"
          - "Allowed Network: {{ network_subnet }}"
    
    - name: Test database connection from localhost
      mysql_db:
        name: "{{ db_name }}"
        state: present
        login_unix_socket: /var/lib/mysql/mysql.sock
      register: db_local_test
    
    - name: Display database status
      debug:
        msg: "MariaDB is running and {{ db_name }} database is accessible"
      when: db_local_test is succeeded
