---
# 전체 인프라 자동 구축 Playbook
# 실행: ansible-playbook all_setup.yml

- name: Setup Storage Server (NFS)
  hosts: storage
  become: yes
  tasks:
    - name: Install NFS server packages
      yum:
        name:
          - nfs-utils
          - rpcbind
        state: present

    - name: Create NFS export directory
      file:
        path: /srv/nfs/shared
        state: directory
        owner: nfsnobody
        group: nfsnobody
        mode: '0755'

    - name: Configure NFS exports
      template:
        src: template/exports.j2
        dest: /etc/exports
        owner: root
        group: root
        mode: '0644'
      notify: restart nfs

    - name: Enable and start rpcbind
      systemd:
        name: rpcbind
        state: started
        enabled: yes

    - name: Enable and start NFS server
      systemd:
        name: nfs-server
        state: started
        enabled: yes

    - name: Open NFS ports in firewall
      firewalld:
        service: "{{ item }}"
        permanent: yes
        state: enabled
        immediate: yes
      loop:
        - nfs
        - rpc-bind
        - mountd

    - name: Export NFS shares
      command: exportfs -ra
      changed_when: false

  handlers:
    - name: restart nfs
      systemd:
        name: nfs-server
        state: restarted

- name: Setup Database Server (MariaDB)
  hosts: database
  become: yes
  tasks:
    - name: Install MariaDB server packages
      yum:
        name:
          - mariadb-server
          - python3-PyMySQL
        state: present

    - name: Configure MariaDB for remote access
      template:
        src: template/mariadb-server.cnf.j2
        dest: /etc/my.cnf.d/server.cnf
        owner: root
        group: root
        mode: '0644'
      notify: restart mariadb

    - name: Enable and start MariaDB
      systemd:
        name: mariadb
        state: started
        enabled: yes

    - name: Set MariaDB root password
      mysql_user:
        name: root
        password: "{{ db_password }}"
        host: localhost
        login_unix_socket: /var/lib/mysql/mysql.sock
      no_log: true
      ignore_errors: yes

    - name: Create .my.cnf file
      template:
        src: template/root-my.cnf.j2
        dest: /root/.my.cnf
        owner: root
        group: root
        mode: '0600'
      no_log: true

    - name: Remove anonymous users
      mysql_user:
        name: ''
        host_all: yes
        state: absent
      ignore_errors: yes

    - name: Create WordPress database
      mysql_db:
        name: wordpress
        state: present
        encoding: utf8mb4
        collation: utf8mb4_unicode_ci

    - name: Create WordPress user
      mysql_user:
        name: wpuser
        password: "{{ db_password }}"
        priv: "wordpress.*:ALL"
        host: "192.168.56.%"
        state: present
      no_log: true

    - name: Open MariaDB port in firewall
      firewalld:
        port: 3306/tcp
        permanent: yes
        state: enabled
        immediate: yes

  handlers:
    - name: restart mariadb
      systemd:
        name: mariadb
        state: restarted

- name: Setup Web Servers (WEB01, WEB02)
  hosts: webservers
  become: yes
  tasks:
    - name: Install Apache and PHP packages
      yum:
        name:
          - httpd
          - mod_ssl
          - php
          - php-mysqlnd
          - php-fpm
          - php-json
          - php-gd
          - php-mbstring
          - php-xml
          - nfs-utils
        state: present

    - name: Create web directories
      file:
        path: "{{ item }}"
        state: directory
        owner: apache
        group: apache
        mode: '0755'
      loop:
        - /srv/web
        - /srv/web/web01
        - /srv/web/web02
        - /srv/web/wordpress
        - /srv/web/shared

    - name: Configure Apache to listen on port 8080
      lineinfile:
        path: /etc/httpd/conf/httpd.conf
        line: 'Listen 8080'
        insertafter: '^Listen 80'
      notify: restart apache

    - name: Mount NFS share
      mount:
        path: /srv/web/shared
        src: "{{ nfs_server }}:/srv/nfs/shared"
        fstype: nfs
        opts: defaults,_netdev
        state: mounted

    - name: Configure SELinux for Apache
      seboolean:
        name: "{{ item }}"
        state: yes
        persistent: yes
      loop:
        - httpd_can_network_connect
        - httpd_can_network_connect_db
        - httpd_use_nfs

    - name: Open HTTP ports in firewall
      firewalld:
        port: "{{ item }}"
        permanent: yes
        state: enabled
        immediate: yes
      loop:
        - 80/tcp
        - 8080/tcp

    - name: Enable and start Apache
      systemd:
        name: httpd
        state: started
        enabled: yes

  handlers:
    - name: restart apache
      systemd:
        name: httpd
        state: restarted

- name: Configure WEB01 (WordPress)
  hosts: WEB01
  become: yes
  tasks:
    - name: Create VirtualHost for WordPress (port 80)
      template:
        src: template/wp01_site2.conf.j2
        dest: /etc/httpd/conf.d/wordpress.conf
        owner: root
        group: root
        mode: '0644'
      notify: restart apache

    - name: Create VirtualHost for web01 (port 8080)
      template:
        src: template/web01_site1.conf.j2
        dest: /etc/httpd/conf.d/web01.conf
        owner: root
        group: root
        mode: '0644'
      notify: restart apache

    - name: Create index.html for web01
      template:
        src: template/web01_index.j2
        dest: /srv/web/web01/index.html
        owner: apache
        group: apache
        mode: '0644'

    - name: Download WordPress
      get_url:
        url: https://wordpress.org/latest.tar.gz
        dest: /tmp/wordpress.tar.gz
        mode: '0644'

    - name: Extract WordPress
      unarchive:
        src: /tmp/wordpress.tar.gz
        dest: /tmp/
        remote_src: yes
        creates: /tmp/wordpress

    - name: Copy WordPress files
      synchronize:
        src: /tmp/wordpress/
        dest: /srv/web/wordpress/
      delegate_to: "{{ inventory_hostname }}"

    - name: Set WordPress ownership
      file:
        path: /srv/web/wordpress
        state: directory
        owner: apache
        group: apache
        recurse: yes

    - name: Create WordPress config
      template:
        src: template/wp-config.php.j2
        dest: /srv/web/wordpress/wp-config.php
        owner: apache
        group: apache
        mode: '0640'

  handlers:
    - name: restart apache
      systemd:
        name: httpd
        state: restarted

- name: Configure WEB02 (Static Web)
  hosts: WEB02
  become: yes
  tasks:
    - name: Create VirtualHost for web02 (port 80)
      template:
        src: template/web02_site1.conf.j2
        dest: /etc/httpd/conf.d/web02-80.conf
        owner: root
        group: root
        mode: '0644'
      notify: restart apache

    - name: Create VirtualHost for web02 (port 8080)
      template:
        src: template/web02_site2.conf.j2
        dest: /etc/httpd/conf.d/web02-8080.conf
        owner: root
        group: root
        mode: '0644'
      notify: restart apache

    - name: Create index.html for web02
      template:
        src: template/web02_index.j2
        dest: /srv/web/web02/index.html
        owner: apache
        group: apache
        mode: '0644'

  handlers:
    - name: restart apache
      systemd:
        name: httpd
        state: restarted

- name: Setup Load Balancer (HAProxy + BIND)
  hosts: lb
  become: yes
  tasks:
    - name: Install HAProxy
      yum:
        name: haproxy
        state: present

    - name: Create HAProxy config
      template:
        src: template/haproxy.cfg.j2
        dest: /etc/haproxy/haproxy.cfg
        owner: root
        group: root
        mode: '0644'
        validate: 'haproxy -c -f %s'
      notify: restart haproxy

    - name: Configure SELinux for HAProxy
      seboolean:
        name: haproxy_connect_any
        state: yes
        persistent: yes

    - name: Install BIND DNS
      yum:
        name:
          - bind
          - bind-utils
        state: present

    - name: Create BIND config
      template:
        src: template/named.conf.j2
        dest: /etc/named.conf
        owner: root
        group: named
        mode: '0640'
        validate: 'named-checkconf %s'
      notify: restart named

    - name: Create zone directory
      file:
        path: /var/named/zones
        state: directory
        owner: root
        group: named
        mode: '0750'

    - name: Create zone file
      template:
        src: template/db.example.com.j2
        dest: /var/named/zones/db.example.com
        owner: root
        group: named
        mode: '0640'
      notify: restart named

    - name: Open firewall ports
      firewalld:
        port: "{{ item }}"
        permanent: yes
        state: enabled
        immediate: yes
      loop:
        - 80/tcp
        - 8404/tcp

    - name: Open DNS port
      firewalld:
        service: dns
        permanent: yes
        state: enabled
        immediate: yes

    - name: Enable and start HAProxy
      systemd:
        name: haproxy
        state: started
        enabled: yes

    - name: Enable and start BIND
      systemd:
        name: named
        state: started
        enabled: yes

  handlers:
    - name: restart haproxy
      systemd:
        name: haproxy
        state: restarted

    - name: restart named
      systemd:
        name: named
        state: restarted
