---
# Load Balancer setup playbook (LB01)
# Configures HAProxy and BIND DNS
# Execute: ansible-playbook lb_setup.yml

- name: Setup Load Balancer Server
  hosts: lb
  become: yes
  
  pre_tasks:
    - name: Update system packages
      yum:
        name: '*'
        state: latest
        update_cache: yes
  
  roles:
    - haproxy
    - bind_dns
  
  post_tasks:
    - name: Display Load Balancer URLs
      debug:
        msg:
          - "HAProxy Stats: http://{{ ansible_host }}:8404/stats"
          - "Username: {{ haproxy_stats_user }}"
          - "Password: {{ haproxy_stats_password }}"
    
    - name: Verify HAProxy backend status
      uri:
        url: "http://{{ ansible_host }}:8404/stats"
        user: "{{ haproxy_stats_user }}"
        password: "{{ haproxy_stats_password }}"
        force_basic_auth: yes
        return_content: yes
      register: haproxy_stats
      ignore_errors: yes
    
    - name: Test DNS resolution
      command: dig @{{ ansible_host }} {{ domain_name }}
      register: dns_test
      changed_when: false
      ignore_errors: yes
